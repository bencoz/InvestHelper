name: Doc-Gardener Agent

on:
  schedule:
    # Run on Wednesday at 2:00 AM
    - cron: '0 2 * * 3'
  workflow_dispatch:

jobs:
  doc-gardening:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run Doc Gardening LLM Script
        # This script cross-references source code definitions (like in app.py or stock_utils.py)
        # against README.md and AGENTS.md to ensure context boundaries are accurate.
        env:
          LLM_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Stale context leads to agent failure! Starting Doc Gardening..."
          echo "Simulating LLM extraction of API endpoints vs README..."
          
      - name: Create Documentation Fix Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "[Agent] Update stale documentation"
          title: "📚 Agent Doc-Gardening: Syncing Code with Context"
          body: |
            Docs have drifted from the codebase. The **Doc-Gardening Agent** noticed differences.
            
            **Updates**:
            - Added missing function descriptions to the README.
            - Updated `AGENTS.md` context parameters.
          branch: "agent/doc-gardening"
          base: "main"
