name: E2E Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Install Playwright browsers
      run: playwright install --with-deps chromium
    
    - name: Run tests
      run: |
        pytest tests/e2e/ --headed=false

    # agent-browser: gives CI agents live "eyes" on the app  
    # Uses compact accessibility-tree snapshots (~200-400 tokens, not full DOM)
    - name: Install agent-browser
      run: npm install -g agent-browser && agent-browser install

    - name: Start Streamlit for agent-browser audit
      run: |
        streamlit run app.py --server.headless true --server.port 8502 &
        sleep 10  # wait for server to be ready

    - name: AI-Driven UI Validation (agent-browser)
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        agent-browser open http://localhost:8502
        agent-browser snapshot -i > agent_browser_snapshot.txt
        cat agent_browser_snapshot.txt
        agent-browser screenshot ci_baseline.png
        agent-browser close

    - name: Upload agent-browser artifacts
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: agent-browser-audit
        path: |
          agent_browser_snapshot.txt
          ci_baseline.png

